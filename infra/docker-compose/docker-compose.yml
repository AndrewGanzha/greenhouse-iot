  # Позже: добавь сюда Grafana
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana-data:/var/lib/grafana

volumes:
  mosquitto-data:
